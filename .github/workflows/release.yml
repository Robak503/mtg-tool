name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm deps
        working-directory: app
        run: npm ci

      - name: Build signed Tauri release
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build:release

      - name: Build latest.json
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          $bundleDir = 'app/src-tauri/target/release/bundle/nsis'
          $sigFile = Get-ChildItem -Path $bundleDir -Filter '*.exe.sig' | Select-Object -First 1
          $exeFile = Get-ChildItem -Path $bundleDir -Filter '*-setup.exe' | Select-Object -First 1
          $sig = (Get-Content $sigFile.FullName -Raw).Trim()
          $exeName = $exeFile.Name -replace ' ', '.'
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$exeName"
          $iso = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
          $manifest = [ordered]@{
            version = $version
            notes = "MTG Tool $tag"
            pub_date = $iso
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $sig
                url = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath latest.json -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MTG Tool ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
