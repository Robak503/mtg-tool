name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm deps
        working-directory: app
        run: npm ci

      - name: Cache reference data
        uses: actions/cache@v4
        with:
          path: app/data
          key: refdata-${{ github.run_id }}
          restore-keys: |
            refdata-

      - name: Sync Scryfall bulk (oracle / default / artwork / rulings)
        working-directory: app
        run: node scripts/sync-scryfall-bulk.cjs

      - name: Build slim oracle index
        working-directory: app
        run: node scripts/build-oracle-index.cjs

      - name: Build rules retrieval index
        working-directory: app
        run: node scripts/build-rules-index.cjs

      - name: Sync EDHREC salt scores
        working-directory: app
        run: node scripts/sync-edhrec-salt.cjs

      - name: Sync Commander Spellbook combos
        working-directory: app
        # Spellbook's API rate-limits aggressively — HTTP 429 after
        # ~108 pages of pulls. Marked continue-on-error so a flaky
        # Spellbook doesn't kill the entire release. If sync fails,
        # the bundle ships with whatever was cached from the last
        # successful run, and users can sync in-app on demand.
        continue-on-error: true
        run: node scripts/sync-spellbook.cjs --delay-ms 1500

      - name: Build signed Tauri release
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build:release

      - name: Build latest.json + stable-name installer copy
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          $bundleDir = 'app/src-tauri/target/release/bundle/nsis'
          $sigFile = Get-ChildItem -Path $bundleDir -Filter '*.exe.sig' | Select-Object -First 1
          $exeFile = Get-ChildItem -Path $bundleDir -Filter '*-setup.exe' | Select-Object -First 1
          $sig = (Get-Content $sigFile.FullName -Raw).Trim()
          $exeName = $exeFile.Name -replace ' ', '.'
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$exeName"
          $iso = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
          $manifest = [ordered]@{
            version = $version
            notes = "MTG Tool $tag"
            pub_date = $iso
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $sig
                url = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath latest.json -Encoding utf8

          # Stable-name copy for pod distribution. The URL
          #   github.com/Robak503/mtg-tool/releases/latest/download/MTG-Tool-Setup.exe
          # always 302-redirects to the latest release's copy, so the
          # pod link never changes across versions.
          Copy-Item $exeFile.FullName -Destination 'MTG-Tool-Setup.exe'
          Copy-Item $sigFile.FullName -Destination 'MTG-Tool-Setup.exe.sig'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MTG Tool ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
            MTG-Tool-Setup.exe
            MTG-Tool-Setup.exe.sig
