name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: read by default; only the build job (which publishes the release) gets contents: write.
permissions:
  contents: read

jobs:
  # THE RELEASE'S TEST GATE, sharded exactly like ci.yml (2026-09-29, release-readiness R4). It used to be one
  # unsharded `npm test` step inside the build job under the same 900 s wall: v0.160.0 needed 9m41s for 14,816
  # tests on a 4-CPU runner, the suite has grown ~11% since, and on a 2-CPU runner (what ci.yml hit on
  # 2026-09-03) one job cannot finish inside the wall at all. The build waits on both shards.
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        working-directory: app
        run: npm ci

      # The rules-retrieval route test drives the real rulesRetrieval.js engine, so data/rules-index.json must
      # exist before the suite runs (the v0.149.1 release failed on exactly this). Built from the checked-in CR.
      - name: Build rules index
        working-directory: app
        run: npm run build:rules-index

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Runner facts
        run: node -e "const os=require('os');console.log('cpus',os.cpus().length,'availableParallelism',os.availableParallelism(),'totalmem',Math.round(os.totalmem()/1e9)+'GB','model',(os.cpus()[0]||{}).model)"

      - name: Run tests
        working-directory: app
        # The wrapper's wall catches a HUNG run; it is not a speed budget (see ci.yml).
        env:
          VITEST_TIMEOUT_MS: "900000"
        run: npm test -- --shard=${{ matrix.shard }}/2 --maxWorkers=2

  build:
    needs: test
    permissions:
      contents: write
    # Pinned, not windows-latest, so a signed release can't have its build
    # environment shift mid-flight. GitHub is redirecting windows-latest to
    # windows-2025-vs2026 by 2026-06-15; windows-2025 is the same image that
    # produced the working signed v0.21.0 build, so the cargo + NSIS toolchain
    # is known-good here.
    runs-on: windows-2025
    timeout-minutes: 60
    # A manual workflow_dispatch runs on a branch (ref_type=branch), where
    # github.ref_name is 'master' -> the version-sync step would write "master"
    # into tauri.conf.json and fail the build ~15 min in. Only ever build on a
    # real tag; a branch dispatch skips cleanly.
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # No step pushes with git; the publish action takes its own token. Not persisting the write token in
          # .git/config keeps it away from npm install scripts and build scripts (least privilege).
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # RESTORE-ONLY (was actions/cache@v5, restore+save). A tag-scoped save is
      # unreadable by any future tag run, so every release used to write ~700 MB
      # of dead cargo cache that nothing could ever restore — churning the repo's
      # 10 GB quota and evicting the master-scoped caches (npm, weekly Spellbook)
      # that ARE useful. Restore what a master build (rust.yml) warmed; never save.
      - name: Restore cargo cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install npm deps
        working-directory: app
        run: npm ci

      # The test gate is the `test` job above (two shards, like ci.yml); this job only starts once both are
      # green. The "Build rules retrieval index" step further down (after the reference-data sync) is the one
      # whose output ships in the bundle.

      - name: Sync version to tag (tauri.conf.json + package.json)
        shell: pwsh
        # The Tauri build embeds tauri.conf.json's "version" field into
        # the binary. If we tag v0.1.5 but the source file still says
        # "0.1.0", the installed .exe reports 0.1.0 forever and the
        # auto-updater thinks every release is "newer than installed."
        # Rewrite the file from the tag name before building.
        # ALSO sync app/package.json — the running server reads it for
        # engineVersion() (stamped onto every grind/self-play record), so
        # a stale package.json mis-attributes all recorded data to an old
        # version. npm version (not a JSON round-trip) preserves formatting
        # and updates package-lock.json in lockstep; --allow-same-version
        # keeps it idempotent if the source was already bumped by hand.
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          $confPath = 'app/src-tauri/tauri.conf.json'
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          Write-Host "Tag=$tag, syncing tauri.conf.json $($conf.version) -> $version"
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding utf8
          Write-Host "Wrote $confPath"
          npm --prefix app version $version --no-git-tag-version --allow-same-version
          Write-Host "Synced app/package.json -> $version"

      # RESTORE-ONLY (was actions/cache@v5). Same rationale as the cargo cache:
      # a refdata- save keyed by github.run_id was never restorable by a later
      # release, so it only churned quota. Restore whatever the weekly
      # sync-spellbook workflow (master-scoped, plain refdata- key) last saved;
      # the release re-syncs Scryfall/EDHREC fresh regardless, and the bounded
      # Spellbook step below refreshes combos. Never save from the release job.
      - name: Restore reference data cache
        uses: actions/cache/restore@v5
        with:
          path: app/data
          key: refdata-${{ github.run_id }}
          restore-keys: |
            refdata-

      - name: Sync Scryfall bulk (oracle / default / artwork / rulings)
        working-directory: app
        run: node scripts/sync-scryfall-bulk.cjs

      - name: Build slim oracle index
        working-directory: app
        run: node scripts/build-oracle-index.cjs

      - name: Build slim printings index (Collection feature)
        working-directory: app
        run: node scripts/build-collection-printings-index.cjs

      # Seed a staples price snapshot into the shipped data so the Finance tab
      # has a day-1 baseline (#4). Needs the oracle + printings indexes above.
      # Best-effort: a missing seed just means Finance fills in over time, so a
      # hiccup must never fail the release.
      - name: Seed starter price history (day-1 Finance baseline)
        working-directory: app
        continue-on-error: true
        run: node scripts/build-seed-price-history.mjs

      - name: Build rules retrieval index
        working-directory: app
        run: node scripts/build-rules-index.cjs

      - name: Sync EDHREC salt scores
        working-directory: app
        run: node scripts/sync-edhrec-salt.cjs

      # Card Kingdom fallback prices — fills printings TCGPlayer (Scryfall)
      # can't price so the Vault never shows a nil value. Best-effort: a
      # Card Kingdom hiccup must not fail the release (the cache holds the
      # prior snapshot, and the in-app sync can refresh later).
      - name: Sync Card Kingdom fallback prices
        working-directory: app
        continue-on-error: true
        run: node scripts/sync-cardkingdom-prices.cjs

      # Commander Spellbook combos. The claim that "the refdata- cache holds the
      # weekly snapshot" was FALSE in practice — the weekly workflow saves from
      # ubuntu under a master scope, which a windows tag-run restore can't read
      # (cross-OS cache-version + branch-scope mismatch) — so ~68 releases shipped
      # with ZERO combos. Sync fresh here, bounded + resumable so a rate-limit
      # can't stall the release. continue-on-error: if Spellbook is down AND the
      # restore above brought nothing, the strict bundle guard (prepare-tauri-
      # resources --strict / CI=true) decides whether an empty combos file blocks
      # the release, rather than silently shipping a gutted .exe.
      - name: Sync Commander Spellbook combos (bounded, resumable)
        working-directory: app
        continue-on-error: true
        timeout-minutes: 12
        # Bulk-first combos complete in seconds (variants.json.gz), freeing the budget for the
        # paged /cards sync (bracket data) inside the same 12-minute bound.
        run: node scripts/sync-spellbook.cjs

      - name: Build signed Tauri release
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build:release

      - name: Build latest.json + stable-name installer copy
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          $bundleDir = 'app/src-tauri/target/release/bundle/nsis'
          $sigFile = Get-ChildItem -Path $bundleDir -Filter '*.exe.sig' | Select-Object -First 1
          $exeFile = Get-ChildItem -Path $bundleDir -Filter '*-setup.exe' | Select-Object -First 1
          $sig = (Get-Content $sigFile.FullName -Raw).Trim()
          $exeName = $exeFile.Name -replace ' ', '.'
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$exeName"
          $iso = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
          $manifest = [ordered]@{
            version = $version
            notes = "MTG Tool $tag"
            pub_date = $iso
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $sig
                url = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath latest.json -Encoding utf8

          # Stable-name copy for pod distribution. The URL
          #   github.com/Robak503/mtg-tool/releases/latest/download/MTG-Tool-Setup.exe
          # always 302-redirects to the latest release's copy, so the
          # pod link never changes across versions.
          Copy-Item $exeFile.FullName -Destination 'MTG-Tool-Setup.exe'
          Copy-Item $sigFile.FullName -Destination 'MTG-Tool-Setup.exe.sig'

      # PUBLISH — retried, because this one API call can throw away a ~25-minute
      # signed build. Seen twice on 2026-07-19 (v0.148.0): every build step green,
      # then "No server is currently available to service your request" during a
      # GitHub API/Actions partial outage. The artifacts are NOT uploaded as
      # workflow artifacts, so a failure here means rebuilding from scratch —
      # two spaced retries are far cheaper than that.
      - name: Create GitHub Release
        id: publish
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: ${{ github.ref_name }}
          name: MTG Tool ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
            MTG-Tool-Setup.exe
            MTG-Tool-Setup.exe.sig

      - name: Wait out a transient publish failure
        if: steps.publish.outcome == 'failure'
        run: |
          Write-Host "Publish failed (likely a transient GitHub API error). Waiting 90s before retry 1."
          Start-Sleep -Seconds 90

      - name: Create GitHub Release (retry 1)
        id: publish_retry1
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: ${{ github.ref_name }}
          name: MTG Tool ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
            MTG-Tool-Setup.exe
            MTG-Tool-Setup.exe.sig

      - name: Wait out a transient publish failure (second)
        if: steps.publish.outcome == 'failure' && steps.publish_retry1.outcome == 'failure'
        run: |
          Write-Host "Retry 1 failed. Waiting 240s before the final attempt."
          Start-Sleep -Seconds 240

      # Final attempt — NOT continue-on-error: if this one fails the release
      # genuinely could not be published and the run must go red.
      - name: Create GitHub Release (final attempt)
        if: steps.publish.outcome == 'failure' && steps.publish_retry1.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: MTG Tool ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
            MTG-Tool-Setup.exe
            MTG-Tool-Setup.exe.sig
