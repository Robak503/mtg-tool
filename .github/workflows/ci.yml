name: ci

# Runs the test suite on every push to master and every pull request, so a
# regression is caught before it lands (and before it can reach a release tag).
# Pinned to windows-2025 (not windows-latest) so the suite runs on the same
# image the release pipeline builds on -- see release.yml for the pin rationale.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Run tests
        working-directory: app
        # The wrapper's wall exists to kill a HUNG run (a leaked handle once deadlocked a run for ~5
        # hours), not to enforce a speed budget. Its 5-minute default was calibrated when the suite was
        # far smaller; by 2026-07-18 the suite legitimately took 296-302s on this runner (~76s locally),
        # so the wall started killing HEALTHY runs — four red builds in a row, and one green that
        # squeaked in at 299s. A wall that fails good runs is worse than none, because it trains everyone
        # to ignore red. 15 minutes still catches a real hang (which is unbounded) with honest headroom.
        env:
          VITEST_TIMEOUT_MS: "900000"
        run: npm test
