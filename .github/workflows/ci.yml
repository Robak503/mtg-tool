name: ci

# Runs the test suite on every push to master and every pull request, so a
# regression is caught before it lands (and before it can reach a release tag).
# Pinned to windows-2025 (not windows-latest) so the suite runs on the same
# image the release pipeline builds on -- see release.yml for the pin rationale.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    # 2026-09-03: the windows-2025 runner now exposes 2 CPUs / 9 GB (the "Runner facts" step below proved it),
    # where the green runs earlier that day had four. vitest sizes its pool at CPUs-1, so the whole suite ran
    # on ONE worker and could not finish inside the 900 s wall. Two shards, each on both cores, keep every job
    # well inside the wall WITHOUT raising it — the wall stays a hang detector, not a speed budget.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        working-directory: app
        run: npm ci

      - name: Build rules index
        working-directory: app
        # Pure local transform of the committed knowledge/mtg-judge CR JSON -- no network call, no
        # Scryfall bulk data needed, ~5s. /api/rules-retrieval's route.test.js exercises the shared
        # rulesRetrieval.js engine for real (B1 phase 2 consolidation, 2026-07-23) instead of reading
        # the CR JSON directly, so it now needs data/rules-index.json to exist -- same artifact the
        # release pipeline already builds as its own step, just never needed by CI before this.
        run: npm run build:rules-index

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Runner facts
        # 2026-09-03: four consecutive runs (incl. a control re-run of a previously GREEN commit) hit the 900 s
        # wall with a single-worker signature — per-file durations equal to green, zero parallelism. vitest sizes
        # its pool from availableParallelism()-1, so a runner exposing 2 CPUs runs the suite on ONE worker and
        # can never finish inside the wall. Print the facts before the tests so a red run says WHY, not just THAT.
        run: node -e "const os=require('os');console.log('cpus',os.cpus().length,'availableParallelism',os.availableParallelism(),'totalmem',Math.round(os.totalmem()/1e9)+'GB','model',(os.cpus()[0]||{}).model)"

      - name: Run tests
        working-directory: app
        # The wrapper's wall exists to kill a HUNG run (a leaked handle once deadlocked a run for ~5
        # hours), not to enforce a speed budget. Its 5-minute default was calibrated when the suite was
        # far smaller; by 2026-07-18 the suite legitimately took 296-302s on this runner (~76s locally),
        # so the wall started killing HEALTHY runs — four red builds in a row, and one green that
        # squeaked in at 299s. A wall that fails good runs is worse than none, because it trains everyone
        # to ignore red. 15 minutes still catches a real hang (which is unbounded) with honest headroom.
        env:
          VITEST_TIMEOUT_MS: "900000"
        run: npm test -- --shard=${{ matrix.shard }}/2 --maxWorkers=2
