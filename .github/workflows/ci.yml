name: ci

# Runs the test suite on every push to master and every pull request, so a
# regression is caught before it lands (and before it can reach a release tag).
# Pinned to windows-2025 (not windows-latest) so the suite runs on the same
# image the release pipeline builds on -- see release.yml for the pin rationale.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Run tests
        working-directory: app
        run: npm test
