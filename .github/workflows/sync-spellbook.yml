name: sync-spellbook

# Refresh the Commander Spellbook combo + card snapshot on a schedule,
# independent of the release pipeline.
#
# Why a separate workflow:
#   Spellbook's API rate-limits aggressively (HTTP 429 after ~108 pages
#   of paginated pulls), which historically forced the release workflow
#   to mark its sync step `continue-on-error: true` -bundles shipped
#   with whatever stale snapshot was cached, and there was no recovery
#   path other than waiting for the next release attempt.
#
#   Decoupling the data refresh from the release lets each one fail
#   independently. The SYNC STEP is `continue-on-error` so partial
#   progress (the script is resumable from disk) is saved to the cache
#   either way and picks up where it left off next week — but the RUN
#   still goes red when the sync failed (the last step), so a failure
#   is visible. (2026-09-29: the job used to carry continue-on-error
#   itself, which reported every run green — including four September
#   runs whose job was refused by billing and never ran a step.)
#
# How releases consume the data:
#   release.yml syncs Spellbook itself at every tag (bounded,
#   resumable) and restores the `refdata-` cache this workflow saves
#   only as its starting point / fallback. The cache expires after 7
#   days unused, so this weekly run is what keeps a fallback alive.
#
# Triggers:
#   - Weekly cron (Sunday 03:00 UTC, off-peak) -keeps the cache warm
#     within GitHub Actions' 7-day default TTL.
#   - workflow_dispatch -manual button for "refresh now."

on:
  schedule:
    # Sunday 03:00 UTC. Spellbook combos shift slowly; weekly is plenty.
    - cron: '0 3 * * 0'
  workflow_dispatch:

# actions/cache saves through the runner's own runtime token — no workflow-token scope is needed for it,
# so the job gets read-only contents and nothing else (least privilege; `actions: write` was dropped
# 2026-09-29 — it only let a job running `npm ci` cancel or dispatch workflows).
permissions:
  contents: read

jobs:
  sync:
    # windows-2025, NOT ubuntu: actions/cache computes an OS-scoped version, so a cache saved from
    # ubuntu is INVISIBLE to the windows release runner — that mismatch (plus quota eviction) is how
    # ~68 releases shipped with zero combos. Same OS as release.yml = restorable snapshot.
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install npm deps
        working-directory: app
        run: npm ci

      # Restore the latest reference-data cache. The release pipeline
      # uses the same prefix, so we pick up whatever's freshest:
      # Scryfall + EDHREC + the previous Spellbook snapshot to resume
      # from. We save under our own key so the saved cache doesn't
      # collide with a parallel release run's save.
      - name: Restore reference data cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: app/data
          key: refdata-spellbook-${{ github.run_id }}
          restore-keys: |
            refdata-

      - name: Sync Commander Spellbook combos
        id: sync
        working-directory: app
        # --delay-ms 1500 keeps us comfortably under Spellbook's
        # observed rate-limit threshold. The script is resumable, so
        # even if this step aborts mid-page-range, the partial state
        # written to disk + the cache save below means next week's
        # run picks up where this one stopped. continue-on-error keeps
        # the cache save running; the final step still fails the run.
        continue-on-error: true
        run: node scripts/sync-spellbook.cjs --delay-ms 1500

      - name: Save reference data cache
        # Always save, even if the sync errored out -the on-disk
        # progress is the whole point of the resumability story.
        if: always()
        uses: actions/cache/save@v5
        with:
          path: app/data
          key: refdata-spellbook-${{ github.run_id }}

      - name: Summary
        if: always()
        shell: bash
        # The meta file alone proves nothing — the cache restore supplies last week's copy — so the
        # message follows the SYNC STEP's own outcome.
        run: |
          if [ "${{ steps.sync.outcome }}" = "success" ]; then
            echo "::notice::Spellbook snapshot synced this run"
          else
            echo "::error::Spellbook sync did not complete (outcome: ${{ steps.sync.outcome }}) — partial progress was saved to the cache; next run resumes"
          fi
          if [ -f app/data/spellbook-meta.local.json ]; then cat app/data/spellbook-meta.local.json; fi

      - name: Fail the run when the sync failed
        # Runs after the cache save, so the resumable progress is kept AND the run goes red.
        if: steps.sync.outcome == 'failure'
        shell: bash
        run: exit 1
