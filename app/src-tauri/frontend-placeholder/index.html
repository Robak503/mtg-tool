<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MTG Tool — Loading</title>
  <style>
    /* LEYLINE: green energy through dark glass — matches app/src/app/globals.css */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050705;
      color: #a8bfaa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      background:
        radial-gradient(ellipse 100% 70% at 50% -10%, rgba(86, 214, 93, 0.07) 0%, rgba(86, 214, 93, 0.015) 32%, transparent 60%),
        #050705;
    }
    .wordmark {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #56d65d;
      text-shadow: 0 0 14px rgba(86, 214, 93, 0.5);
    }
    #status {
      font-size: 13px;
      color: #a8bfaa;
    }
    .line {
      width: 180px;
      height: 2px;
      border-radius: 2px;
      background: rgba(86, 214, 93, 0.15);
      overflow: hidden;
      position: relative;
    }
    .line::after {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #56d65d;
      box-shadow: 0 0 10px rgba(86, 214, 93, 0.7);
      animation: ley-scan 1.4s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    @keyframes ley-scan {
      to { left: 100%; }
    }
    #hint {
      font-size: 12px;
      color: #6d826f;
      max-width: 480px;
      text-align: center;
      padding: 0 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wordmark">MTG Tool</div>
  <div id="status">Starting the engine</div>
  <div class="line"></div>
  <div id="hint">
    First launch can take a minute while ~1 GB of card &amp; rules data
    is seeded into AppData.
  </div>
  <script>
    // The Tauri shell (lib.rs) has already waited up to 30s for the
    // bundled Next.js server to come up on 127.0.0.1:3000. On first
    // launch the seed step (copying ~1GB of card/rule/combo data from
    // resources/ to AppData) can take 30-60s on a slow disk before
    // node even spawns, so this retry loop runs for 2 full minutes
    // before giving up.
    (function () {
      var target = "http://127.0.0.1:3000/";
      var tries = 0;
      var maxTries = 240;            // 240 * 500ms = 2 minutes
      function go() {
        // Probe /api/health and require a READABLE ok:true before redirecting.
        // A bare connectivity probe would happily redirect into a stale orphaned
        // server from an old build squatting on the port (no /api/health there →
        // this fetch keeps failing → we keep waiting + finally show the error
        // message, instead of silently rendering a zombie's stale data).
        fetch(target + "api/health")
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j && j.ok) { window.location.replace(target); }
            else { throw new Error("not our server"); }
          })
          .catch(function () {
            if (++tries >= maxTries) {
              document.body.innerHTML =
                "<div style='text-align:center;padding:24px;max-width:480px;color:#e6f0e6'>" +
                "<strong>Could not reach local server at " + target + ".</strong><br/><br/>" +
                "Try restarting MTG Tool. If this keeps happening, check the launch.log " +
                "in %APPDATA%\\com.colton.mtg-tool\\ for spawn errors. Most often this " +
                "means Node.js isn't installed or isn't on PATH." +
                "</div>";
              return;
            }
            // After 10s, swap the message to acknowledge it's a longer wait
            if (tries === 20) {
              document.getElementById("status").textContent = "Still loading…";
            }
            setTimeout(go, 500);
          });
      }
      go();
    })();
  </script>
</body>
</html>
