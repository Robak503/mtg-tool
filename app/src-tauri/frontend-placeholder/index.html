<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MTG Tool — Loading</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a0a;
      color: #d4d4d4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #6a6a6a;
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="status">MTG Tool starting</div>
  <div class="dot"></div>
  <div id="hint" style="font-size: 12px; color: #6a6a6a; max-width: 480px; text-align: center; padding: 0 24px;">
    First launch can take a minute while ~1 GB of card &amp; rules data
    is seeded into AppData.
  </div>
  <script>
    // The Tauri shell (lib.rs) has already waited up to 30s for the
    // bundled Next.js server to come up on 127.0.0.1:3000. On first
    // launch the seed step (copying ~1GB of card/rule/combo data from
    // resources/ to AppData) can take 30-60s on a slow disk before
    // node even spawns, so this retry loop runs for 2 full minutes
    // before giving up.
    (function () {
      var target = "http://127.0.0.1:3000/";
      var tries = 0;
      var maxTries = 240;            // 240 * 500ms = 2 minutes
      function go() {
        fetch(target, { mode: "no-cors" })
          .then(function () { window.location.replace(target); })
          .catch(function () {
            if (++tries >= maxTries) {
              document.body.innerHTML =
                "<div style='text-align:center;padding:24px;max-width:480px'>" +
                "<strong>Could not reach local server at " + target + ".</strong><br/><br/>" +
                "Try restarting MTG Tool. If this keeps happening, check the launch.log " +
                "in %APPDATA%\\com.colton.mtg-tool\\ for spawn errors. Most often this " +
                "means Node.js isn't installed or isn't on PATH." +
                "</div>";
              return;
            }
            // After 10s, swap the message to acknowledge it's a longer wait
            if (tries === 20) {
              document.getElementById("status").textContent = "Still loading…";
            }
            setTimeout(go, 500);
          });
      }
      go();
    })();
  </script>
</body>
</html>
