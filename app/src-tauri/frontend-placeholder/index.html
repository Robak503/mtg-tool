<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MTG Tool — Loading</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a0a;
      color: #d4d4d4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #6a6a6a;
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div>MTG Tool starting</div>
  <div class="dot"></div>
  <script>
    // The Tauri shell (lib.rs) has already waited for the bundled Next.js
    // server to come up on 127.0.0.1:3000 before showing this window, so
    // a single redirect is enough. If the server somehow isn't ready,
    // a short retry loop covers that gap.
    (function () {
      var target = "http://127.0.0.1:3000/";
      var tries = 0;
      function go() {
        fetch(target, { mode: "no-cors" })
          .then(function () { window.location.replace(target); })
          .catch(function () {
            if (++tries < 30) setTimeout(go, 500);
            else document.body.innerHTML =
              "<div style='text-align:center;padding:24px'>" +
              "Could not reach local server at " + target + ".<br/>" +
              "Try restarting MTG Tool. If this keeps happening, check that " +
              "Node.js is installed and on PATH." +
              "</div>";
          });
      }
      go();
    })();
  </script>
</body>
</html>
