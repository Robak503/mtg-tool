[package]
name = "mtg-tool"
# Kept in lockstep with tauri.conf.json (the bundle authority — CI syncs THAT from the tag;
# this one is informational for cargo metadata). Drifted 0.3.0→aligned in the overhaul pass.
version = "0.97.0"
description = "MTG Tool — local-first Commander assistant"
authors = ["Colton"]
# Source-available, not open source (see repo LICENSE). NOT MIT — this crate is
# never published to crates.io; it builds the app binary only.
license-file = "../../LICENSE"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# Windows-only. Used by src/lib.rs to (1) pin the bundled Node server to a
# Job Object that kills it when mtg-tool.exe dies for ANY reason — including
# the auto-updater force-replacing the .exe, which skips our graceful
# child.kill() path and otherwise orphans next-server on port 3000 — and
# (2) reap any pre-fix orphan still running when a fixed build first launches.
# Version 0.59 is already resolved in the tree via Tauri's transitive deps,
# so this adds no new crate compile, only a few extra feature modules.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }
