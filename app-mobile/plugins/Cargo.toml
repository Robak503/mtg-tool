[package]
name = "tauri-plugin-omnath-model"
version = "0.1.0"
authors = [ "Colton" ]
description = "Offline LiteRT-LM lifecycle bridge for Omnath Android"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-omnath-model"

[dependencies]
tauri = { version = "2.11.2" }
serde = "1.0"
serde_json = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.2", features = ["build"] }
